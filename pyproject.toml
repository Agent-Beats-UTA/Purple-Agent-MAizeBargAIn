[project]
name = "maizebargain-purple-agent"
version = "1.0.0"
description = "Purple agent for the MAizeBargAIn meta-game negotiation benchmark"
readme = { text = "", content-type = "text/plain" }
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk[http-server]>=0.3.20",
    "openai>=1.0.0",
    "anthropic>=0.40.0",
    "pydantic>=2.12.0",
    "python-dotenv>=1.2.0",
    "uvicorn>=0.38.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "core"]
